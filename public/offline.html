<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B3C91">
<title>Offline | Elite SACCO Mbarara</title>
<style>
:root{
  --blue:#1B3C91;--blue-deep:#0F2566;--blue-ink:#0A1A4A;--blue-soft:#E9EEFB;--blue-mid:#6C85CC;--white:#fff;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--blue-ink);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(108,133,204,.55),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(108,133,204,.35),transparent 60%),
    linear-gradient(160deg,var(--blue) 0%,var(--blue-deep) 100%);
  background-attachment:fixed;
}
.card{
  width:100%;max-width:440px;text-align:center;background:var(--white);border-radius:28px;
  padding:2.2rem 2rem 2.4rem;border-top:6px solid var(--blue);
  box-shadow:0 40px 80px -20px rgba(5,15,50,.55);
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.icon{
  width:88px;height:88px;margin:0 auto 1.2rem;border-radius:50%;background:var(--blue-soft);
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:46px;height:46px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--blue);margin-bottom:.6rem}
p{line-height:1.65;margin-bottom:.9rem}
.brand{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-mid);margin-bottom:1rem}
.status{
  display:inline-flex;align-items:center;gap:.5rem;margin:.4rem 0 .2rem;padding:.45rem .9rem;
  background:var(--blue-soft);border-radius:999px;font-size:.85rem;font-weight:700;color:var(--blue);
}
.dot{width:9px;height:9px;border-radius:50%;background:#D62828}
.status.on .dot{background:#0a7a3b}
.btn{
  width:100%;margin-top:1.4rem;padding:1rem;border:0;border-radius:14px;cursor:pointer;
  font:700 1rem var(--font);letter-spacing:.02em;color:var(--white);
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-deep) 100%);
  box-shadow:0 14px 26px -10px rgba(27,60,145,.7);transition:transform .15s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 30px -10px rgba(27,60,145,.8)}
.btn:active{transform:none}
.btn:focus-visible{outline:3px solid #A9BBF0;outline-offset:2px}
.hint{margin-top:1.2rem;font-size:.85rem;color:#4a5a8c;margin-bottom:0}
</style>
</head>
<body>
<main class="card" role="main">
  <div class="brand">Elite SACCO Mbarara</div>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1B3C91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0"/>
      <path d="M5.5 12.4a10 10 0 0 1 13 0"/>
      <path d="M9 16a5 5 0 0 1 6 0"/>
      <circle cx="12" cy="19.5" r="1" fill="#1B3C91"/>
      <path d="M3 3l18 18" stroke="#D62828"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>We can't reach the server right now. Check your internet connection (Wi-Fi or mobile data) and try again.</p>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">No connection</span></div>
  <button class="btn" id="retry" type="button">Try again</button>
  <p class="hint">This page will reload automatically when your connection returns.</p>
</main>

<script>
(function(){
  var box=document.getElementById('status'),txt=document.getElementById('statusText'),btn=document.getElementById('retry');
  function goBack(){location.reload();}
  function setOnline(){box.classList.add('on');txt.textContent='Back online, reloading…';setTimeout(goBack,600);}
  btn.addEventListener('click',function(){
    btn.textContent='Checking…';
    fetch(location.href,{cache:'no-store'}).then(function(){setOnline();}).catch(function(){
      btn.textContent='Try again';txt.textContent='Still offline';
    });
  });
  window.addEventListener('online',setOnline);
  if(navigator.onLine===true && !/offline/i.test(location.pathname)){setOnline();}
})();
</script>
</body>
</html>
