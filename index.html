<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite SACCO Mbarara</title>
  <style>
    :root {
      --blue: #1b3c91;
      --blue-deep: #0f2566;
      --blue-ink: #0a1a4a;
      --blue-soft: #e9eefb;
      --line: #d5ddf2;
      --white: #fff;
      --red: #d62828;
      --green: #0a7a3b;
      --font: "Manrope", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--blue-ink);
      background: linear-gradient(160deg, var(--blue) 0%, var(--blue-deep) 100%);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: min(1120px, calc(100% - 2rem));
      margin: 1rem auto 0;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(5,15,50,0.25);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--white);
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--white);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      font-weight: 900;
    }

    nav {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    nav button {
      background: transparent;
      color: rgba(255,255,255,0.85);
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font: 600 0.95rem var(--font);
      cursor: pointer;
    }

    nav button[aria-selected="true"] {
      background: var(--white);
      color: var(--blue);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem 3rem;
    }

    .card {
      width: min(100%, 440px);
      background: var(--white);
      border-radius: 28px;
      padding: 2rem 2rem 2.1rem;
      box-shadow: 0 40px 80px -20px rgba(5,15,50,0.55);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .logo-badge {
      width: 180px;
      height: 80px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue-soft), #cfe0ff);
      display: grid;
      place-items: center;
      color: var(--blue);
      font-weight: 900;
      font-size: 1.7rem;
      letter-spacing: 0.06em;
    }

    h1, h2 {
      margin: 0 0 1rem;
      font-size: 1.7rem;
      text-align: center;
      color: var(--blue);
    }

    label {
      display: block;
      color: var(--blue);
      font-weight: 600;
      font-size: 0.85rem;
      margin: 1rem 0 0.45rem;
    }

    input {
      width: 100%;
      border: 1.5px solid transparent;
      background: var(--blue-soft);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      font: 500 1rem var(--font);
      color: var(--blue-ink);
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(27, 60, 145, 0.12);
    }

    .btn {
      width: 100%;
      margin-top: 1.5rem;
      border: 0;
      border-radius: 14px;
      padding: 1rem;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
      color: var(--white);
      font: 700 1rem var(--font);
      cursor: pointer;
      box-shadow: 0 14px 26px -10px rgba(27,60,145,0.7);
    }

    .btn.secondary {
      background: #fff;
      color: var(--blue);
      border: 1.5px solid var(--blue);
      box-shadow: none;
      margin-top: 0.9rem;
    }

    .alt {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.92rem;
      color: var(--blue-ink);
    }

    .alt a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 800;
      border-bottom: 2px solid rgba(27,60,145,0.35);
    }

    .msg {
      margin-top: 0.8rem;
      min-height: 1.2em;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--green);
    }

    .msg.err {
      color: var(--red);
    }

    .dashboard {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #f3f6fd;
      color: var(--blue-ink);
      padding: 2rem;
    }

    body.logged-in .dashboard {
      display: block;
    }

    body.logged-in main {
      display: none;
    }

    body.logged-in .topbar {
      display: none;
    }

    .dash-shell {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 22px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 12px 35px -20px rgba(15,37,102,0.4);
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .dash-top h2 {
      margin: 0;
      color: var(--blue);
      font-size: 1.55rem;
      text-align: left;
    }

    .logout {
      border: 0;
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font: 700 0.9rem var(--font);
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 1rem 0 1.5rem;
    }

    .stat {
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
      color: var(--white);
      border-radius: 16px;
      padding: 1rem 1.1rem;
    }

    .stat small {
      opacity: 0.8;
      display: block;
      margin-bottom: 0.3rem;
    }

    .stat strong {
      font-size: 1.45rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 26, 74, 0.6);
      padding: 1rem;
      z-index: 20;
    }

    .modal.open {
      display: flex;
    }

    .modal-panel {
      width: min(100%, 620px);
      max-height: 90vh;
      overflow: auto;
      background: var(--white);
      border-radius: 24px;
      padding: 1.5rem 1.4rem;
      box-shadow: 0 40px 80px -20px rgba(5,15,50,0.7);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.8rem;
      text-align: left;
    }

    .close-btn {
      border: 0;
      background: var(--blue-soft);
      color: var(--blue);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font: 700 1.5rem var(--font);
      cursor: pointer;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem 1rem;
    }

    .full { grid-column: 1 / -1; }

    .required {
      color: var(--red);
      font-weight: 800;
    }

    @media (max-width: 520px) {
      .card { padding: 1.5rem 1.2rem 1.7rem; }
      .topbar { justify-content: center; }
      nav { justify-content: center; }
      .dash-shell { padding: 1rem; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <span>Elite SACCO Mbarara</span>
    </div>
    <nav aria-label="Main navigation">
      <button type="button" aria-selected="true">Login</button>
      <button type="button" aria-selected="false">About Us</button>
      <button type="button" aria-selected="false">Services</button>
    </nav>
  </header>

  <main>
    <section class="card" aria-label="Login section">
      <div class="logo">
        <div class="logo-badge">ELITE</div>
      </div>
      <h1>Login</h1>
      <form id="loginForm" novalidate>
        <label for="userId">Email or phone number</label>
        <input id="userId" name="id" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="pw" type="password" autocomplete="current-password" required />

        <button class="btn" type="submit">Login</button>
        <div id="loginMsg" class="msg" aria-live="polite"></div>

        <p class="alt">Don't have an account? <a href="#" id="openReg">Create Account</a></p>
      </form>
    </section>
  </main>

  <div id="regModal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="regTitle">
      <div class="modal-header">
        <h2 id="regTitle">Create Account</h2>
        <button class="close-btn" id="closeReg" type="button" aria-label="Close registration">&times;</button>
      </div>

      <form id="registerForm" novalidate>
        <div class="two-col">
          <div>
            <label for="firstName">First Name <span class="required">*</span></label>
            <input id="firstName" name="firstName" type="text" required />
          </div>

          <div>
            <label for="lastName">Last Name <span class="required">*</span></label>
            <input id="lastName" name="lastName" type="text" required />
          </div>

          <div class="full">
            <label for="regPhone">Phone <span class="required">*</span></label>
            <input id="regPhone" name="phone" type="tel" autocomplete="tel" required />
          </div>

          <div class="full">
            <label for="regEmail">Email</label>
            <input id="regEmail" name="email" type="email" autocomplete="email" />
          </div>

          <div>
            <label for="regPassword">Password <span class="required">*</span></label>
            <input id="regPassword" name="password" type="password" minlength="6" autocomplete="new-password" required />
          </div>

          <div>
            <label for="regConfirmPassword">Confirm Password <span class="required">*</span></label>
            <input id="regConfirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required />
          </div>
        </div>

        <div id="regMsg" class="msg" aria-live="polite"></div>
        <button class="btn" type="submit">Create Account</button>
        <button class="btn secondary" type="button" id="cancelReg">Cancel</button>
      </form>
    </div>
  </div>

  <section class="dashboard" aria-live="polite">
    <div class="dash-shell">
      <div class="dash-top">
        <h2>Dashboard</h2>
        <button class="logout" id="logoutBtn" type="button">Logout</button>
      </div>
      <div class="stats">
        <div class="stat"><small>Members</small><strong id="memberCount">0</strong></div>
        <div class="stat"><small>Loan Book</small><strong id="loanBook">UGX 0</strong></div>
        <div class="stat"><small>Savings</small><strong id="savingsTotal">UGX 0</strong></div>
      </div>
      <p>Welcome to the Elite SACCO management dashboard.</p>
    </div>
  </section>

  <script>
    const STORAGE_KEY = 'esacco';
    const DEFAULT_ADMIN = {
      name: 'System Admin',
      email: 'admin@elitesacco.co.ug',
      phone: '+256700000000',
      role: 'Admin',
      pw: 'Admin123!'
    };

    const normalizeEmail = (v) => String(v || '').trim().toLowerCase();
    const normalizePhone = (v) => String(v || '').replace(/[^0-9+]/g, '');
    const normalizeText = (v) => String(v || '').trim();

    const emptyState = () => ({
      users: [{ ...DEFAULT_ADMIN }],
      members: [],
      savings: [],
      loans: [],
      audit: []
    });

    const isAdminUser = (user) => {
      const email = normalizeEmail(user?.email || '');
      const phone = normalizePhone(user?.phone || '');
      const name = normalizeText(user?.name || '').toLowerCase();
      return email === normalizeEmail(DEFAULT_ADMIN.email)
        || phone === normalizePhone(DEFAULT_ADMIN.phone)
        || name.includes('system admin');
    };

    const sanitizeUserRecord = (user) => {
      if (!user || typeof user !== 'object') return null;
      const name = normalizeText(user.name || `${user.first || ''} ${user.last || ''}`.trim());
      const email = normalizeEmail(user.email || '');
      const phone = normalizePhone(user.phone || '');
      const pw = String(user.pw || user.password || '');
      if (!name && !email && !phone && !pw) return null;
      return {
        name,
        first: normalizeText(user.first || ''),
        last: normalizeText(user.last || ''),
        email,
        phone,
        role: user.role || 'Member',
        pw,
        nin: normalizeText(user.nin || '')
      };
    };

    const loadState = () => {
      const base = emptyState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return base;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return base;

        const users = Array.isArray(saved.users)
          ? saved.users.map(sanitizeUserRecord).filter(Boolean)
          : [...base.users];

        const safeUsers = users.length ? users : [...base.users];
        if (!safeUsers.some(isAdminUser)) safeUsers.unshift({ ...DEFAULT_ADMIN });

        return {
          ...base,
          ...saved,
          users: safeUsers
        };
      } catch (e) {
        return base;
      }
    };

    let S = loadState();

    const persistState = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
      } catch (e) {
        // Ignore storage errors.
      }
    };

    const ensureDefaultAdmin = () => {
      if (!S.users || !Array.isArray(S.users)) {
        S.users = [{ ...DEFAULT_ADMIN }];
      }
      if (!S.users.some(isAdminUser)) {
        S.users.unshift({ ...DEFAULT_ADMIN });
      }
      S.users = S.users.map(sanitizeUserRecord).filter(Boolean);
      if (!S.users.some(isAdminUser)) {
        S.users.unshift({ ...DEFAULT_ADMIN });
      }
    };

    ensureDefaultAdmin();

    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');
    const regModal = document.getElementById('regModal');
    const registerForm = document.getElementById('registerForm');
    const regMsg = document.getElementById('regMsg');

    const openRegModal = () => {
      regModal.classList.add('open');
      regModal.setAttribute('aria-hidden', 'false');
      registerForm.reset();
      regMsg.textContent = '';
      regMsg.classList.remove('err');
    };

    const closeRegModal = () => {
      regModal.classList.remove('open');
      regModal.setAttribute('aria-hidden', 'true');
      registerForm.reset();
      regMsg.textContent = '';
      regMsg.classList.remove('err');
    };

    document.getElementById('openReg').addEventListener('click', (event) => {
      event.preventDefault();
      openRegModal();
    });

    document.getElementById('closeReg').addEventListener('click', closeRegModal);
    document.getElementById('cancelReg').addEventListener('click', closeRegModal);
    regModal.addEventListener('click', (event) => {
      if (event.target === regModal) closeRegModal();
    });

    const getUserByLogin = (id, password) => {
      const rawId = normalizeText(id);
      const key = normalizeEmail(rawId);
      const phone = normalizePhone(rawId);
      const shortKey = key.replace(/@elitesacco\.co\.ug$/, '');

      return S.users.find((user) => {
        const userEmail = normalizeEmail(user.email || '');
        const userPhone = normalizePhone(user.phone || '');
        const pwMatch = String(user.pw || '') === String(password || '');
        const emailMatches =
          userEmail === key ||
          userEmail === `${shortKey}@elitesacco.co.ug` ||
          userEmail === `${key}@elitesacco.co.ug` ||
          normalizeEmail(user.name || '') === key;
        const phoneMatches = userPhone === phone;
        return (emailMatches || phoneMatches) && pwMatch;
      });
    };

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = document.getElementById('userId').value;
      const pw = document.getElementById('password').value;

      const user = getUserByLogin(id, pw);
      if (!user) {
        loginMsg.textContent = 'Invalid login details.';
        loginMsg.classList.add('err');
        return;
      }

      loginMsg.textContent = '';
      loginMsg.classList.remove('err');
      document.body.classList.add('logged-in');
      persistState();
    });

    registerForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const first = normalizeText(form.firstName.value);
      const last = normalizeText(form.lastName.value);
      const phone = normalizePhone(form.phone.value);
      const email = normalizeEmail(form.email.value);
      const password = String(form.password.value || '');
      const confirmPassword = String(form.confirmPassword.value || '');

      regMsg.textContent = '';
      regMsg.classList.remove('err');

      if (!first || !last || !phone || !password || !confirmPassword) {
        regMsg.textContent = 'Please complete all required fields.';
        regMsg.classList.add('err');
        return;
      }

      if (password.length < 6) {
        regMsg.textContent = 'Password must be at least 6 characters long.';
        regMsg.classList.add('err');
        return;
      }

      if (password !== confirmPassword) {
        regMsg.textContent = 'Passwords do not match.';
        regMsg.classList.add('err');
        return;
      }

      const duplicateUser = S.users.some((user) => {
        const sameEmail = email && normalizeEmail(user.email || '') === email;
        const samePhone = phone && normalizePhone(user.phone || '') === phone;
        return sameEmail || samePhone;
      });

      if (duplicateUser) {
        regMsg.textContent = 'An account with this email or phone already exists.';
        regMsg.classList.add('err');
        return;
      }

      const newUser = {
        name: `${first} ${last}`.trim(),
        first,
        last,
        email,
        phone,
        role: 'Member',
        pw: password
      };

      S.users = [...S.users, newUser];
      ensureDefaultAdmin();
      persistState();

      regMsg.textContent = 'Account created successfully. You can now log in.';
      regMsg.classList.remove('err');
      form.reset();
      setTimeout(() => closeRegModal(), 1100);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.body.classList.remove('logged-in');
      loginForm.reset();
      loginMsg.textContent = '';
      loginMsg.classList.remove('err');
    });

    const memberCount = document.getElementById('memberCount');
    const loanBook = document.getElementById('loanBook');
    const savingsTotal = document.getElementById('savingsTotal');
    const formatCurrency = (value) => 'UGX ' + Number(value || 0).toLocaleString();

    const updateDashboard = () => {
      const memberUsers = S.users.filter((user) => !isAdminUser(user));
      memberCount.textContent = String(memberUsers.length);
      loanBook.textContent = formatCurrency((S.loans || []).reduce((sum, loan) => sum + Number(loan.amount || 0), 0));
      savingsTotal.textContent = formatCurrency((S.savings || []).reduce((sum, saving) => sum + Number(saving.amount || 0), 0));
    };

    updateDashboard();
  </script>
</body>
</html>
