<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite SACCO Mbarara</title>
  <style>
    :root {
      --blue: #1b3c91;
      --blue-deep: #0f2566;
      --blue-ink: #0a1a4a;
      --blue-soft: #e9eefb;
      --line: #d5ddf2;
      --white: #fff;
      --red: #d62828;
      --green: #0a7a3b;
      --font: "Manrope", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--blue-ink);
      background: linear-gradient(160deg, var(--blue) 0%, var(--blue-deep) 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .topbar {
      width: min(1120px, calc(100% - 2rem));
      margin: 1rem auto 0;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(5,15,50,0.25);
    }

    .brand { display: flex; align-items: center; gap: 0.8rem; color: var(--white); font-weight: 800; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 10px; background: var(--white); color: var(--blue);
      display: grid; place-items: center; font-size: 1.2rem; font-weight: 900;
    }

    nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    nav button {
      background: transparent; border: 0; border-radius: 10px; color: rgba(255,255,255,0.85);
      padding: 0.65rem 1rem; font: 600 0.95rem var(--font); cursor: pointer;
    }
    nav button[aria-selected="true"] { background: var(--white); color: var(--blue); }

    main {
      flex: 1; display: grid; place-items: center; padding: 2rem 1rem 3rem;
    }

    .card {
      width: min(100%, 440px); background: var(--white); border-radius: 28px; padding: 2rem 2rem 2.1rem;
      box-shadow: 0 40px 80px -20px rgba(5,15,50,0.55);
    }

    .logo { display: flex; justify-content: center; margin-bottom: 0.5rem; }
    .logo-badge {
      width: 180px; height: 80px; border-radius: 18px; background: linear-gradient(135deg, var(--blue-soft), #cfe0ff);
      display: grid; place-items: center; color: var(--blue); font-weight: 900; font-size: 1.7rem; letter-spacing: 0.06em;
    }

    h1, h2 { margin: 0 0 1rem; font-size: 1.7rem; text-align: center; color: var(--blue); }
    label { display: block; color: var(--blue); font-weight: 600; font-size: 0.85rem; margin: 1rem 0 0.45rem; }
    input, select {
      width: 100%; border: 1.5px solid transparent; background: var(--blue-soft); border-radius: 14px;
      padding: 0.9rem 1rem; font: 500 1rem var(--font); color: var(--blue-ink);
    }
    input:focus, select:focus { outline: none; border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 4px rgba(27,60,145,0.12); }

    .btn {
      width: 100%; margin-top: 1.5rem; border: 0; border-radius: 14px; padding: 1rem;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%); color: var(--white);
      font: 700 1rem var(--font); cursor: pointer; box-shadow: 0 14px 26px -10px rgba(27,60,145,0.7);
    }
    .btn.secondary {
      background: #fff; color: var(--blue); border: 1.5px solid var(--blue); box-shadow: none; margin-top: 0.9rem;
    }

    .alt { margin-top: 1rem; text-align: center; font-size: 0.92rem; color: var(--blue-ink); }
    .alt a { color: var(--blue); text-decoration: none; font-weight: 800; border-bottom: 2px solid rgba(27,60,145,0.35); }

    .msg {
      margin-top: 0.8rem; min-height: 1.2em; font-weight: 700; font-size: 0.82rem; color: var(--green);
    }
    .msg.err { color: var(--red); }

    .dashboard {
      display: none; width: 100%; min-height: 100vh; background: #f3f6fd; padding: 2rem; color: var(--blue-ink);
    }
    body.logged-in .dashboard { display: block; }
    body.logged-in main { display: none; }
    body.logged-in .topbar { display: none; }

    .dash-shell {
      max-width: 1100px; margin: 0 auto; background: var(--white); border-radius: 22px; padding: 1.25rem 1.5rem;
      box-shadow: 0 12px 35px -20px rgba(15,37,102,0.4);
    }

    .dash-top {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid var(--line);
      padding-bottom: 1rem; margin-bottom: 1rem;
    }
    .dash-top h2 { margin: 0; text-align: left; font-size: 1.55rem; }
    .dash-actions { display: flex; gap: .7rem; align-items: center; }
    .logout, .admin-action {
      border: 0; background: var(--blue-soft); color: var(--blue); border-radius: 12px; padding: 0.72rem 1rem;
      font: 700 0.9rem var(--font); cursor: pointer;
    }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1rem 0 1.5rem; }
    .stat {
      background: linear-gradient(135deg, var(--blue), var(--blue-deep)); color: var(--white); border-radius: 16px; padding: 1rem 1.1rem;
    }
    .stat small { opacity: 0.8; display: block; margin-bottom: 0.3rem; }
    .stat strong { font-size: 1.45rem; }

    .section-box {
      background: #ffffff; border: 1px solid var(--line); border-radius: 18px; padding: 1rem; margin-top: 1rem;
      box-shadow: 0 10px 18px -16px rgba(15,37,102,0.35);
    }
    .section-box h3 { margin: 0 0 0.8rem; font-size: 1rem; color: var(--blue); }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 560px; }
    th, td { padding: 0.7rem 0.8rem; text-align: left; border-bottom: 1px solid var(--line); }
    th { background: var(--blue-soft); color: var(--blue); }

    .chip {
      display: inline-block; background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 0.2rem 0.7rem;
      font-size: 0.78rem; font-weight: 700;
    }

    .modal {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,26,74,0.6);
      padding: 1rem; z-index: 20;
    }
    .modal.open { display: flex; }
    .modal-panel {
      width: min(100%, 620px); max-height: 90vh; overflow: auto; background: var(--white); border-radius: 24px;
      padding: 1.5rem 1.4rem; box-shadow: 0 40px 80px -20px rgba(5,15,50,0.7);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
    .modal-header h2 { margin: 0; text-align: left; }
    .close-btn {
      border: 0; background: var(--blue-soft); color: var(--blue); width: 38px; height: 38px; border-radius: 50%;
      font: 700 1.5rem var(--font); cursor: pointer;
    }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem 1rem; }
    .full { grid-column: 1 / -1; }
    .required { color: var(--red); font-weight: 800; }

    @media (max-width: 520px) {
      .card { padding: 1.5rem 1.2rem 1.7rem; }
      .topbar { justify-content: center; }
      nav { justify-content: center; }
      .dash-shell { padding: 1rem; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <span>Elite SACCO Mbarara</span>
    </div>
    <nav aria-label="Main navigation">
      <button type="button" aria-selected="true">Login</button>
      <button type="button" aria-selected="false">About Us</button>
      <button type="button" aria-selected="false">Services</button>
    </nav>
  </header>

  <main>
    <section class="card" aria-label="Login section">
      <div class="logo"><div class="logo-badge">ELITE</div></div>
      <h1>Login</h1>
      <form id="loginForm" novalidate>
        <label for="userId">Email or phone number</label>
        <input id="userId" name="id" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="pw" type="password" autocomplete="current-password" required />

        <button class="btn" type="submit">Login</button>
        <div id="loginMsg" class="msg" aria-live="polite"></div>

        <p class="alt">Don't have an account? <a href="#" id="openReg">Create Account</a></p>
        <p class="alt"><a href="#" id="openReset">Forgot password?</a></p>
      </form>
    </section>
  </main>

  <div id="regModal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="regTitle">
      <div class="modal-header">
        <h2 id="regTitle">Create Account</h2>
        <button class="close-btn" id="closeReg" type="button" aria-label="Close registration">&times;</button>
      </div>
      <form id="registerForm" novalidate>
        <div class="two-col">
          <div><label for="firstName">First Name <span class="required">*</span></label><input id="firstName" name="firstName" type="text" required /></div>
          <div><label for="lastName">Last Name <span class="required">*</span></label><input id="lastName" name="lastName" type="text" required /></div>
          <div class="full"><label for="regPhone">Phone <span class="required">*</span></label><input id="regPhone" name="phone" type="tel" autocomplete="tel" required /></div>
          <div class="full"><label for="regEmail">Email</label><input id="regEmail" name="email" type="email" autocomplete="email" /></div>
          <div><label for="regPassword">Password <span class="required">*</span></label><input id="regPassword" name="password" type="password" minlength="6" autocomplete="new-password" required /></div>
          <div><label for="regConfirmPassword">Confirm Password <span class="required">*</span></label><input id="regConfirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required /></div>
        </div>
        <div id="regMsg" class="msg" aria-live="polite"></div>
        <button class="btn" type="submit">Create Account</button>
        <button class="btn secondary" type="button" id="cancelReg">Cancel</button>
      </form>
    </div>
  </div>

  <div id="resetModal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
      <div class="modal-header">
        <h2 id="resetTitle">Reset Password</h2>
        <button class="close-btn" id="closeReset" type="button" aria-label="Close password reset">&times;</button>
      </div>
      <form id="resetForm" novalidate>
        <div class="two-col">
          <div class="full"><label for="resetId">Email or phone number <span class="required">*</span></label><input id="resetId" name="resetId" type="text" required /></div>
          <div class="full"><label for="newPassword">New password <span class="required">*</span></label><input id="newPassword" name="newPassword" type="password" minlength="6" required /></div>
          <div class="full"><label for="newPasswordConfirm">Confirm new password <span class="required">*</span></label><input id="newPasswordConfirm" name="newPasswordConfirm" type="password" minlength="6" required /></div>
        </div>
        <div id="resetMsg" class="msg" aria-live="polite"></div>
        <button class="btn" type="submit">Reset Password</button>
        <button class="btn secondary" type="button" id="cancelReset">Cancel</button>
      </form>
    </div>
  </div>

  <section class="dashboard" aria-live="polite">
    <div class="dash-shell">
      <div class="dash-top">
        <h2 id="dashboardTitle">Dashboard</h2>
        <div class="dash-actions">
          <button class="admin-action" id="refreshUsers" type="button">Refresh</button>
          <button class="logout" id="logoutBtn" type="button">Logout</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><small>Members</small><strong id="memberCount">0</strong></div>
        <div class="stat"><small>Loan Book</small><strong id="loanBook">UGX 0</strong></div>
        <div class="stat"><small>Savings</small><strong id="savingsTotal">UGX 0</strong></div>
      </div>

      <div id="dashboardContent"></div>
    </div>
  </section>

  <script>
    const STORAGE_KEY = 'esacco';
    const DEFAULT_ADMIN = {
      name: 'System Admin',
      email: 'admin@elitesacco.co.ug',
      phone: '+256700000000',
      role: 'Admin',
      pw: 'Admin123!'
    };

    const normalizeEmail = (v) => String(v || '').trim().toLowerCase();
    const normalizePhone = (v) => String(v || '').replace(/[^0-9+]/g, '');
    const normalizeText = (v) => String(v || '').trim();

    const emptyState = () => ({
      users: [{ ...DEFAULT_ADMIN }],
      members: [],
      savings: [],
      loans: [],
      audit: []
    });

    const isAdminUser = (user = {}) => {
      const email = normalizeEmail(user.email || '');
      const phone = normalizePhone(user.phone || '');
      return email === normalizeEmail(DEFAULT_ADMIN.email) || phone === normalizePhone(DEFAULT_ADMIN.phone) || (user.role || '').toLowerCase() === 'admin';
    };

    const sanitizeUserRecord = (user) => {
      if (!user || typeof user !== 'object') return null;
      const name = normalizeText(user.name || `${user.first || ''} ${user.last || ''}`.trim());
      const email = normalizeEmail(user.email || '');
      const phone = normalizePhone(user.phone || '');
      const pw = String(user.pw || user.password || '');
      if (!name && !email && !phone && !pw) return null;
      return {
        name,
        first: normalizeText(user.first || ''),
        last: normalizeText(user.last || ''),
        email,
        phone,
        role: normalizeText(user.role || 'Member'),
        pw,
        nin: normalizeText(user.nin || '')
      };
    };

    const loadState = () => {
      const base = emptyState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return base;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return base;
        const users = Array.isArray(saved.users)
          ? saved.users.map(sanitizeUserRecord).filter(Boolean)
          : [...base.users];
        const safeUsers = users.length ? users : [...base.users];
        if (!safeUsers.some(isAdminUser)) safeUsers.unshift({ ...DEFAULT_ADMIN });
        return { ...base, ...saved, users: safeUsers.map(sanitizeUserRecord).filter(Boolean) };
      } catch (e) {
        return base;
      }
    };

    let S = loadState();
    let currentUser = null;

    const ensureDefaultAdmin = () => {
      if (!S.users || !Array.isArray(S.users)) S.users = [{ ...DEFAULT_ADMIN }];
      S.users = S.users.map(sanitizeUserRecord).filter(Boolean);
      if (!S.users.some(isAdminUser)) S.users.unshift({ ...DEFAULT_ADMIN });
    };
    ensureDefaultAdmin();

    const persistState = () => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
    };

    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');
    const dashboardTitle = document.getElementById('dashboardTitle');
    const dashboardContent = document.getElementById('dashboardContent');

    const formatCurrency = (value) => 'UGX ' + Number(value || 0).toLocaleString();
    const memberUsers = () => S.users.filter((user) => !isAdminUser(user));

    const renderDashboard = () => {
      if (!currentUser) return;
      const isAdmin = isAdminUser(currentUser);
      dashboardTitle.textContent = isAdmin ? 'Admin Dashboard' : 'Member Dashboard';

      const userCount = S.users.length;
      const savings = (S.savings || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const loans = (S.loans || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      document.getElementById('memberCount').textContent = String(memberUsers().length);
      document.getElementById('loanBook').textContent = formatCurrency(loans);
      document.getElementById('savingsTotal').textContent = formatCurrency(savings);

      if (isAdmin) {
        dashboardContent.innerHTML = `
          <div class="section-box">
            <h3>Welcome, ${esc(currentUser.name || 'Administrator')}</h3>
            <p>Use this dashboard to manage system users, assign roles, and monitor the SACCO.</p>
          </div>

          <div class="section-box">
            <h3>System users</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                  </tr>
                </thead>
                <tbody>
                  ${S.users.map((user) => `
                    <tr>
                      <td>${esc(user.name || 'Unknown')}</td>
                      <td>${esc(user.email || '-')}</td>
                      <td>${esc(user.phone || '-')}</td>
                      <td>
                        <select data-user-email="${esc(user.email || '')}" data-role-select>
                          ${['Admin','Treasurer','Credit Officer','Member'].map((role) => `<option value="${role}" ${user.role === role ? 'selected' : ''}>${role}</option>`).join('')}
                        </select>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        document.querySelectorAll('[data-role-select]').forEach((select) => {
          select.addEventListener('change', (event) => {
            const email = event.target.getAttribute('data-user-email');
            const role = event.target.value;
            const target = S.users.find((user) => normalizeEmail(user.email || '') === normalizeEmail(email));
            if (!target) return;
            target.role = role;
            persistState();
            renderDashboard();
          });
        });
      } else {
        const memberName = currentUser.name || `${currentUser.first || ''} ${currentUser.last || ''}`.trim() || 'Member';
        const userSavings = (S.savings || []).filter((item) => normalizeText(item.user || item.email || '') === normalizeEmail(currentUser.email || '') || normalizePhone(item.phone || '') === normalizePhone(currentUser.phone || '') || normalizeText(item.member || '') === normalizeText(currentUser.name || '')).reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const memberLoans = (S.loans || []).filter((item) => normalizeText(item.user || item.email || '') === normalizeEmail(currentUser.email || '') || normalizePhone(item.phone || '') === normalizePhone(currentUser.phone || '') || normalizeText(item.member || '') === normalizeText(currentUser.name || '')).reduce((sum, item) => sum + Number(item.amount || 0), 0);

        dashboardContent.innerHTML = `
          <div class="section-box">
            <h3>Welcome, ${esc(memberName)}</h3>
            <p>Your SACCO member dashboard is ready. You can review your account status, savings, and loan updates.</p>
          </div>

          <div class="section-box">
            <h3>Member Summary</h3>
            <div class="table-wrap">
              <table>
                <tr><th>Member</th><td>${esc(memberName)}</td></tr>
                <tr><th>Email</th><td>${esc(currentUser.email || '-')}</td></tr>
                <tr><th>Phone</th><td>${esc(currentUser.phone || '-')}</td></tr>
                <tr><th>Role</th><td><span class="chip">${esc(currentUser.role || 'Member')}</span></td></tr>
                <tr><th>Savings</th><td>${formatCurrency(userSavings)}</td></tr>
                <tr><th>Loans</th><td>${formatCurrency(memberLoans)}</td></tr>
              </table>
            </div>
          </div>
        `;
      }
    };

    const regModal = document.getElementById('regModal');
    const resetModal = document.getElementById('resetModal');
    const registerForm = document.getElementById('registerForm');
    const resetForm = document.getElementById('resetForm');
    const regMsg = document.getElementById('regMsg');
    const resetMsg = document.getElementById('resetMsg');

    const openModal = (modal) => { modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); };
    const closeModal = (modal) => { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); };

    document.getElementById('openReg').addEventListener('click', (event) => { event.preventDefault(); openModal(regModal); });
    document.getElementById('closeReg').addEventListener('click', () => closeModal(regModal));
    document.getElementById('cancelReg').addEventListener('click', () => closeModal(regModal));
    regModal.addEventListener('click', (event) => { if (event.target === regModal) closeModal(regModal); });

    document.getElementById('openReset').addEventListener('click', (event) => { event.preventDefault(); openModal(resetModal); });
    document.getElementById('closeReset').addEventListener('click', () => closeModal(resetModal));
    document.getElementById('cancelReset').addEventListener('click', () => closeModal(resetModal));
    resetModal.addEventListener('click', (event) => { if (event.target === resetModal) closeModal(resetModal); });

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));

    const getUserByLogin = (id, password) => {
      const rawId = normalizeText(id);
      const key = normalizeEmail(rawId);
      const shortKey = key.replace(/@elitesacco\.co\.ug$/, '');
      const phone = normalizePhone(rawId);
      return S.users.find((user) => {
        const userEmail = normalizeEmail(user.email || '');
        const userPhone = normalizePhone(user.phone || '');
        const passwordMatch = String(user.pw || '') === String(password || '');
        const emailMatches = userEmail === key || userEmail === `${shortKey}@elitesacco.co.ug` || userEmail === `${key}@elitesacco.co.ug` || normalizeEmail(user.name || '') === key;
        const phoneMatches = userPhone === phone;
        return (emailMatches || phoneMatches) && passwordMatch;
      });
    };

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = document.getElementById('userId').value;
      const pw = document.getElementById('password').value;
      const user = getUserByLogin(id, pw);

      if (!user) {
        loginMsg.textContent = 'Invalid login details.';
        loginMsg.classList.add('err');
        return;
      }

      currentUser = user;
      loginMsg.textContent = '';
      loginMsg.classList.remove('err');
      document.body.classList.add('logged-in');
      renderDashboard();
      persistState();
    });

    registerForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const first = normalizeText(form.firstName.value);
      const last = normalizeText(form.lastName.value);
      const phone = normalizePhone(form.phone.value);
      const email = normalizeEmail(form.email.value);
      const password = String(form.password.value || '');
      const confirmPassword = String(form.confirmPassword.value || '');

      regMsg.textContent = '';
      regMsg.classList.remove('err');

      if (!first || !last || !phone || !password || !confirmPassword) {
        regMsg.textContent = 'Please complete all required fields.';
        regMsg.classList.add('err');
        return;
      }

      if (password.length < 6) {
        regMsg.textContent = 'Password must be at least 6 characters long.';
        regMsg.classList.add('err');
        return;
      }

      if (password !== confirmPassword) {
        regMsg.textContent = 'Passwords do not match.';
        regMsg.classList.add('err');
        return;
      }

      const duplicateUser = S.users.some((user) => {
        const sameEmail = email && normalizeEmail(user.email || '') === email;
        const samePhone = phone && normalizePhone(user.phone || '') === phone;
        return sameEmail || samePhone;
      });

      if (duplicateUser) {
        regMsg.textContent = 'An account with this email or phone already exists.';
        regMsg.classList.add('err');
        return;
      }

      S.users.push({
        name: `${first} ${last}`.trim(),
        first,
        last,
        email,
        phone,
        role: 'Member',
        pw: password
      });

      ensureDefaultAdmin();
      persistState();
      regMsg.textContent = 'Account created successfully. You can now log in.';
      regMsg.classList.remove('err');
      form.reset();
      setTimeout(() => closeModal(regModal), 1000);
    });

    resetForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = document.getElementById('resetId').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('newPasswordConfirm').value;

      resetMsg.textContent = '';
      resetMsg.classList.remove('err');

      if (!id || !newPassword || !confirmPassword) {
        resetMsg.textContent = 'Please complete all fields.';
        resetMsg.classList.add('err');
        return;
      }

      if (newPassword.length < 6) {
        resetMsg.textContent = 'Password must be at least 6 characters long.';
        resetMsg.classList.add('err');
        return;
      }

      if (newPassword !== confirmPassword) {
        resetMsg.textContent = 'Passwords do not match.';
        resetMsg.classList.add('err');
        return;
      }

      const target = S.users.find((user) => {
        const emailMatch = normalizeEmail(user.email || '') === normalizeEmail(id) || normalizeEmail(user.email || '') === `${normalizeEmail(id)}@elitesacco.co.ug`;
        const phoneMatch = normalizePhone(user.phone || '') === normalizePhone(id);
        return emailMatch || phoneMatch;
      });

      if (!target) {
        resetMsg.textContent = 'No account was found for that email or phone.';
        resetMsg.classList.add('err');
        return;
      }

      target.pw = newPassword;
      persistState();
      resetMsg.textContent = 'Password reset successfully.';
      resetForm.reset();
      setTimeout(() => closeModal(resetModal), 1000);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      currentUser = null;
      document.body.classList.remove('logged-in');
      loginForm.reset();
      loginMsg.textContent = '';
      loginMsg.classList.remove('err');
    });

    document.getElementById('refreshUsers').addEventListener('click', () => renderDashboard());

    const updateMetrics = () => {
      const memberTotal = memberUsers().length;
      const savings = (S.savings || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const loans = (S.loans || []).reduce((sum, item) => sum + Number(item.amount || 0), 0);
      document.getElementById('memberCount').textContent = String(memberTotal);
      document.getElementById('loanBook').textContent = formatCurrency(loans);
      document.getElementById('savingsTotal').textContent = formatCurrency(savings);
    };

    document.addEventListener('DOMContentLoaded', () => {
      updateMetrics();
      if (currentUser) renderDashboard();
    });
  </script>
</body>
</html>
