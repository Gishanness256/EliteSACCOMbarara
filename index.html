<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite SACCO Mbarara</title>
  <style>
    :root {
      --blue: #1b3c91;
      --blue-deep: #0f2566;
      --blue-ink: #0a1a4a;
      --blue-soft: #e9eefb;
      --line: #d5ddf2;
      --white: #fff;
      --red: #d62828;
      --font: "Manrope", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--blue-ink);
      background: linear-gradient(160deg, var(--blue) 0%, var(--blue-deep) 100%);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: min(1120px, calc(100% - 2rem));
      margin: 1rem auto 0;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(5,15,50,0.25);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--white);
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--white);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      font-weight: 900;
    }

    nav {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    nav button {
      background: transparent;
      color: rgba(255,255,255,0.85);
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font: 600 0.95rem var(--font);
      cursor: pointer;
    }

    nav button[aria-selected="true"] {
      background: var(--white);
      color: var(--blue);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem 3rem;
    }

    .card {
      width: min(100%, 440px);
      background: var(--white);
      border-radius: 28px;
      padding: 2rem 2rem 2.1rem;
      box-shadow: 0 40px 80px -20px rgba(5,15,50,0.55);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .logo-badge {
      width: 180px;
      height: 80px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--blue-soft), #cfe0ff);
      display: grid;
      place-items: center;
      color: var(--blue);
      font-weight: 900;
      font-size: 1.7rem;
      letter-spacing: 0.06em;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.7rem;
      text-align: center;
      color: var(--blue);
    }

    label {
      display: block;
      color: var(--blue);
      font-weight: 600;
      font-size: 0.85rem;
      margin: 1rem 0 0.45rem;
    }

    input {
      width: 100%;
      border: 1.5px solid transparent;
      background: var(--blue-soft);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      font: 500 1rem var(--font);
      color: var(--blue-ink);
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(27, 60, 145, 0.12);
    }

    .btn {
      width: 100%;
      margin-top: 1.5rem;
      border: 0;
      border-radius: 14px;
      padding: 1rem;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
      color: var(--white);
      font: 700 1rem var(--font);
      cursor: pointer;
      box-shadow: 0 14px 26px -10px rgba(27,60,145,0.7);
    }

    .alt {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.92rem;
      color: var(--blue-ink);
    }

    .alt a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 800;
      border-bottom: 2px solid rgba(27,60,145,0.35);
    }

    .msg {
      margin-top: 0.8rem;
      min-height: 1.2em;
      font-weight: 700;
      font-size: 0.82rem;
      color: #0a7a3b;
    }

    .msg.err {
      color: var(--red);
    }

    .dashboard {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #f3f6fd;
      color: var(--blue-ink);
      padding: 2rem;
    }

    body.logged-in .dashboard {
      display: block;
    }

    body.logged-in main {
      display: none;
    }

    body.logged-in .topbar {
      display: none;
    }

    .dash-shell {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 22px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 12px 35px -20px rgba(15,37,102,0.4);
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .dash-top h2 {
      margin: 0;
      color: var(--blue);
      font-size: 1.55rem;
    }

    .logout {
      border: 0;
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font: 700 0.9rem var(--font);
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin: 1rem 0 1.5rem;
    }

    .stat {
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
      color: var(--white);
      border-radius: 16px;
      padding: 1rem 1.1rem;
    }

    .stat small {
      opacity: 0.8;
      display: block;
      margin-bottom: 0.3rem;
    }

    .stat strong {
      font-size: 1.45rem;
    }

    @media (max-width: 520px) {
      .card { padding: 1.5rem 1.2rem 1.7rem; }
      .topbar { justify-content: center; }
      nav { justify-content: center; }
      .dash-shell { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <span>Elite SACCO Mbarara</span>
    </div>
    <nav aria-label="Main navigation">
      <button type="button" aria-selected="true">Login</button>
      <button type="button" aria-selected="false">About Us</button>
      <button type="button" aria-selected="false">Services</button>
    </nav>
  </header>

  <main>
    <section class="card" aria-label="Login section">
      <div class="logo">
        <div class="logo-badge">ELITE</div>
      </div>
      <h1>Login</h1>
      <form id="loginForm" novalidate>
        <label for="userId">Email or phone number</label>
        <input id="userId" name="id" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="pw" type="password" autocomplete="current-password" required />

        <button class="btn" type="submit">Login</button>
        <div id="loginMsg" class="msg" aria-live="polite"></div>

        <p class="alt">Don't have an account? <a href="#" id="openReg">Create Account</a></p>
      </form>
    </section>
  </main>

  <section class="dashboard" aria-live="polite">
    <div class="dash-shell">
      <div class="dash-top">
        <h2>Dashboard</h2>
        <button class="logout" id="logoutBtn" type="button">Logout</button>
      </div>
      <div class="stats">
        <div class="stat"><small>Members</small><strong id="memberCount">0</strong></div>
        <div class="stat"><small>Loan Book</small><strong id="loanBook">UGX 0</strong></div>
        <div class="stat"><small>Savings</small><strong id="savingsTotal">UGX 0</strong></div>
      </div>
      <p>Welcome to the Elite SACCO management dashboard.</p>
    </div>
  </section>

  <script>
    const DEFAULT_ADMIN = {
      name: 'System Admin',
      email: 'admin@elitesacco.co.ug',
      phone: '+256700000000',
      role: 'Admin',
      pw: 'Admin123!'
    };

    const normalizeEmail = (v) => String(v || '').trim().toLowerCase();
    const normalizePhone = (v) => String(v || '').replace(/[^0-9+]/g, '');

    const loadState = () => {
      const base = { users: [DEFAULT_ADMIN], members: [], savings: [], loans: [], audit: [] };
      try {
        const raw = localStorage.getItem('esacco');
        if (!raw) return base;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return base;
        return { ...base, ...saved };
      } catch (e) {
        return base;
      }
    };

    let S = loadState();
    S.users = Array.isArray(S.users) && S.users.length ? S.users : [DEFAULT_ADMIN];

    const ensureDefaultAdmin = () => {
      const hasAdmin = S.users.some((u) => {
        const sameEmail = normalizeEmail(u.email || '') === normalizeEmail(DEFAULT_ADMIN.email);
        const samePhone = normalizePhone(u.phone || '') === normalizePhone(DEFAULT_ADMIN.phone);
        const sameName = (u.name || '').toLowerCase().includes('system admin');
        return sameEmail || samePhone || sameName;
      });

      if (!hasAdmin) {
        S.users.unshift({ ...DEFAULT_ADMIN });
      }
    };

    ensureDefaultAdmin();

    const saveState = () => {
      try {
        localStorage.setItem('esacco', JSON.stringify(S));
      } catch (e) {
        // Ignore storage errors.
      }
    };

    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');

    const getSessionUser = (id, pw) => {
      const rawId = String(id || '').trim();
      const key = normalizeEmail(rawId);
      const shortKey = key.replace(/@elitesacco\.co\.ug$/, '');
      const phone = normalizePhone(rawId);

      return S.users.find((user) => {
        const email = normalizeEmail(user.email || '');
        const userPhone = normalizePhone(user.phone || '');
        const passwordMatch = String(user.pw || '') === String(pw || '');
        const emailMatch =
          email === key ||
          email === `${shortKey}@elitesacco.co.ug` ||
          email === `${key}@elitesacco.co.ug` ||
          normalizeEmail(user.name || '') === key;
        const phoneMatch = userPhone === phone;
        return (emailMatch || phoneMatch) && passwordMatch;
      });
    };

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = document.getElementById('userId').value;
      const pw = document.getElementById('password').value;

      const user = getSessionUser(id, pw);
      if (!user) {
        loginMsg.textContent = 'Invalid login details.';
        loginMsg.classList.add('err');
        return;
      }

      loginMsg.textContent = '';
      loginMsg.classList.remove('err');
      document.body.classList.add('logged-in');
      saveState();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.body.classList.remove('logged-in');
      loginForm.reset();
      loginMsg.textContent = '';
      loginMsg.classList.remove('err');
    });

    document.getElementById('openReg').addEventListener('click', (event) => {
      event.preventDefault();
      alert('Use the default admin login: admin@elitesacco.co.ug / Admin123!');
    });

    const memberCount = document.getElementById('memberCount');
    const loanBook = document.getElementById('loanBook');
    const savingsTotal = document.getElementById('savingsTotal');

    const formatCurrency = (value) => 'UGX ' + Number(value || 0).toLocaleString();

    memberCount.textContent = String(S.members.length || 0);
    loanBook.textContent = formatCurrency((S.loans || []).reduce((sum, loan) => sum + Number(loan.amount || 0), 0));
    savingsTotal.textContent = formatCurrency((S.savings || []).reduce((sum, saving) => sum + Number(saving.amount || 0), 0));
  </script>
</body>
</html>
